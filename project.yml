# XcodeGen specification for the Companion iOS app target.
#
# The .xcodeproj is generated rather than committed. Generating it means the
# project file is produced by a tool that is known to be correct, rather than
# hand-edited — and it keeps merge conflicts out of a 3,000-line pbxproj.
#
# Regenerate with:  make xcodeproj      (or: xcodegen generate)
# Install XcodeGen: brew install xcodegen
#
# Everything except the app entry point lives in the Swift package in this same
# directory, which the app target consumes as a local package dependency. That
# is what allows `swift build` and `swift test` to verify the domain and UI code
# without Xcode.

name: Companion
options:
  bundleIdPrefix: com.companion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Warnings are worth reading, so the project does not bury them.
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  Companion:
    path: .

targets:
  Companion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Companion
        excludes:
          - Info.plist
    dependencies:
      - package: Companion
        product: CompanionCore
      - package: Companion
        product: CompanionUI
    # Deliberately no `info:` key. That would make XcodeGen *generate* a plist at
    # the given path, overwriting the hand-written one — including every usage
    # description and the background-location mode. Pointing INFOPLIST_FILE at
    # the committed file uses it as-is.
    # Team ID and bundle identifier come from the gitignored Signing.xcconfig,
    # so regenerating the project never wipes signing settings — and a Team ID
    # never lands in the repository.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Companion
        INFOPLIST_FILE: Sources/Companion/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        # Required for background location. Xcode adds the matching entitlement
        # automatically; the Info.plist declares the background mode itself.
        ENABLE_BITCODE: NO

  CompanionUIAutomation:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CompanionUIAutomation
    dependencies:
      - target: Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).uitests
        TEST_TARGET_NAME: Companion
        CODE_SIGN_STYLE: Automatic
        # The test bundle has no hand-written plist, so let Xcode synthesise one.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Companion:
    build:
      targets:
        Companion: all
        CompanionUIAutomation: [test]
    run:
      config: Debug
    # The package's tests are not listed here: XcodeGen cannot reference a Swift
    # package's test targets from an app scheme. Run them with `swift test`, or
    # from Xcode's Test navigator, where the local package's tests appear once
    # the project is open.
    test:
      config: Debug
      targets:
        - CompanionUIAutomation
